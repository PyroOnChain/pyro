<!doctype html>
<html>

    </div>
    <div style="grid-column: span 5; border-left: 1px solid #2A241D; padding-left: 28px;">
      <div style="font-size: 11px; letter-spacing: 0.16em; color: #8A7E70; margin-bottom: 22px;">THE MECHANISM</div>
      <div style="display: flex; flex-direction: column; gap: 20px;">
        <div>
          <div style="font-family: 'Instrument Serif', serif; font-size: 19px; margin-bottom: 7px;">I. Deposit</div>
          <div style="height: 7px; background: #241E18; margin-bottom: 3px;"></div>

        </div>
        <div>
          <div style="font-family: 'Instrument Serif', serif; font-size: 19px; margin-bottom: 7px;">II. Launch</div>
          <div style="height: 7px; background: #241E18; margin-bottom: 3px;"></div>
          <div style="height: 7px; background: #241E18; width: 78%;"></div>
        </div>
        <div>
          <div style="font-family: 'Instrument Serif', serif; font-size: 19px; margin-bottom: 7px;">III. Harvest</div>
          <div style="height: 7px; background: #241E18; margin-bottom: 3px;"></div>
          <div style="height: 7px; background: #241E18; width: 54%;"></div>
        </div>
      </div>
    </div>
  </div>
  <div style="margin-top: 44px; padding-top: 22px; border-top: 1px solid #2A241D; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px;">
    <div><div style="font-family: 'Instrument Serif', serif; font-size: 26px;">41.6</div><div style="font-size: 11px; color: #8A7E70;">NVDA to graduate</div></div>
    <div><div style="font-family: 'Instrument Serif', serif; font-size: 26px;">0%</div><div style="font-size: 11px; color: #8A7E70;">protocol fee</div></div>
    <div><div style="font-family: 'Instrument Serif', serif; font-size: 26px;">24h</div><div style="font-size: 11px; color: #8A7E70;">harvest drip</div></div>
    <div><div style="font-family: 'Instrument Serif', serif; font-size: 26px;">4</div><div style="font-size: 11px; color: #8A7E70;">tickers supported</div></div>
